name: Refresh live profile banner

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_live_banner.py'
      - '.github/workflows/live-banner.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate live banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_live_banner.py
      - name: Commit refreshed banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-banner.svg
          if git diff --cached --quiet; then
            echo "No banner changes"
            exit 0
          fi
          git commit -m "Refresh live profile banner [skip ci]"
          git push
