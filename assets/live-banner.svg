    <stop stop-color="#030509"/><stop offset=".42" stop-color="#071117"/><stop offset=".74" stop-color="#0b1719"/><stop offset="1" stop-color="#0a0c10"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#5EEAD4"/><stop offset=".55" stop-color="#A3E635"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#5EEAD4" stop-opacity=".34"/><stop offset=".5" stop-color="#0F766E" stop-opacity=".11"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#13232b" stop-opacity=".82"/><stop offset="1" stop-color="#091116" stop-opacity=".72"/></linearGradient>
  <pattern id="micro" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#17313b" stroke-width="1" opacity=".27"/></pattern>
  <filter id="softGlow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tinyGlow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="screen"><rect x="18" y="18" width="1164" height="524" rx="30"/></clipPath>
</defs>

<rect width="1200" height="560" rx="32" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="558" rx="31" fill="none" stroke="#22424b"/>
<g clip-path="url(#screen)">
