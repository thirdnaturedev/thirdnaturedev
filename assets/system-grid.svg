<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#05080d"/><stop offset=".5" stop-color="#09131a"/><stop offset="1" stop-color="#07110f"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#5EEAD4"/><stop offset=".5" stop-color="#A3E635"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102029"/><stop offset="1" stop-color="#081116"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#17303a" stroke-width="1" opacity=".25"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#1e3b43"/>
<rect width="1200" height="420" rx="26" fill="url(#grid)"/>

<text x="46" y="48" fill="#5EEAD4" font-size="11" letter-spacing="2" font-family="ui-monospace,Menlo,Consolas,monospace">THIRD NATURE / SYSTEM ARCHITECTURE</text>
<text x="1150" y="48" text-anchor="end" fill="#64748B" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace">REALTIME CREATIVE STACK</text>

<!-- backbone -->
<path d="M120 218 H1080" stroke="#173943" stroke-width="2"/>
<path d="M120 218 H330" stroke="url(#edge)" stroke-width="2.5"><animate attributeName="d" values="M120 218 H330;M120 218 H1080;M120 218 H330" dur="8s" repeatCount="indefinite"/></path>

<!-- three premium modules -->
<g font-family="ui-monospace,Menlo,Consolas,monospace">
  <g>
    <rect x="70" y="90" width="315" height="250" rx="22" fill="url(#card)" stroke="#21414a"/>
    <text x="98" y="126" fill="#5EEAD4" font-size="10">01 / EXPERIENCE LAYER</text>
    <text x="98" y="164" fill="#F8FAFC" font-size="24" font-weight="700">IMMERSIVE UI</text>
    <text x="98" y="188" fill="#7D919A" font-size="11">motion · depth · interaction · narrative</text>
    <circle cx="115" cy="238" r="8" fill="#5EEAD4" opacity=".9" filter="url(#glow)"><animate attributeName="r" values="6;10;6" dur="2.6s" repeatCount="indefinite"/></circle>
    <path d="M115 238 C165 190 210 282 260 230 S335 190 350 250" fill="none" stroke="#5EEAD4" stroke-width="2"><animate attributeName="d" dur="4s" repeatCount="indefinite" values="M115 238 C165 190 210 282 260 230 S335 190 350 250;M115 238 C165 280 210 190 260 246 S335 282 350 220;M115 238 C165 190 210 282 260 230 S335 190 350 250"/></path>
    <text x="98" y="308" fill="#A3E635" font-size="10">STATUS / ACTIVE</text>
  </g>

  <g>
    <rect x="442" y="90" width="315" height="250" rx="22" fill="url(#card)" stroke="#21414a"/>
    <text x="470" y="126" fill="#A3E635" font-size="10">02 / PRODUCT LAYER</text>
    <text x="470" y="164" fill="#F8FAFC" font-size="24" font-weight="700">SYSTEMS</text>
    <text x="470" y="188" fill="#7D919A" font-size="11">SaaS · APIs · data · architecture</text>
    <g transform="translate(598 242)">
      <circle r="53" fill="none" stroke="#28454b" stroke-width="1"/>
      <circle r="35" fill="none" stroke="#1c3a40"/>
      <circle cx="0" cy="-53" r="5" fill="#A3E635"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="35" cy="0" r="4" fill="#F59E0B"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/></circle>
      <circle r="7" fill="#5EEAD4"><animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/></circle>
    </g>
    <text x="470" y="308" fill="#A3E635" font-size="10">STATUS / BUILDING</text>
  </g>

  <g>
    <rect x="814" y="90" width="315" height="250" rx="22" fill="url(#card)" stroke="#21414a"/>
    <text x="842" y="126" fill="#F59E0B" font-size="10">03 / PLATFORM LAYER</text>
    <text x="842" y="164" fill="#F8FAFC" font-size="24" font-weight="700">DESKTOP</text>
    <text x="842" y="188" fill="#7D919A" font-size="11">macOS · Windows · native workflows</text>
    <g fill="none" stroke="#F59E0B" stroke-width="1.5">
      <path d="M850 264 L900 215 L951 267 L1001 215 L1058 265" opacity=".6"/>
      <circle cx="850" cy="264" r="4" fill="#F59E0B"/>
      <circle cx="951" cy="267" r="4" fill="#F59E0B"/>
      <circle cx="1058" cy="265" r="4" fill="#F59E0B"/>
      <circle cx="900" cy="215" r="5" fill="#5EEAD4"><animate attributeName="cy" values="215;245;215" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1001" cy="215" r="5" fill="#A3E635"><animate attributeName="cy" values="215;185;215" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="842" y="308" fill="#A3E635" font-size="10">STATUS / SHIPPING</text>
  </g>
</g>

<!-- bottom signal rail -->
<g font-family="ui-monospace,Menlo,Consolas,monospace">
  <circle cx="82" cy="376" r="4" fill="#A3E635"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="96" y="380" fill="#94A3B8" font-size="10.5">SIGNAL PATH: design → motion → engineering → product</text>
  <text x="1118" y="380" text-anchor="end" fill="#5EEAD4" font-size="10.5">THIRD NATURE / ONLINE</text>
</g>
</svg>