<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#17142f"/><stop offset=".45" stop-color="#080b18"/><stop offset="1" stop-color="#02040a"/></radialGradient>
  <radialGradient id="neb"><stop stop-color="#7c3aed" stop-opacity=".35"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="stars" width="92" height="92" patternUnits="userSpaceOnUse"><circle cx="10" cy="14" r="1" fill="#fff" opacity=".75"/><circle cx="63" cy="27" r=".7" fill="#93c5fd" opacity=".8"/><circle cx="31" cy="70" r="1.1" fill="#fff" opacity=".5"/><circle cx="83" cy="80" r=".8" fill="#c4b5fd" opacity=".75"/></pattern>
</defs>
<rect width="1200" height="520" rx="30" fill="url(#bg)"/>
<rect width="1200" height="520" rx="30" fill="url(#stars)" opacity=".9"/>
<circle cx="170" cy="210" r="210" fill="url(#neb)"><animate attributeName="r" values="180;240;180" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="1000" cy="110" r="160" fill="url(#neb)" opacity=".55"><animate attributeName="cx" values="980;1030;980" dur="14s" repeatCount="indefinite"/></circle>
<g transform="translate(190 258)">
  <circle r="116" fill="none" stroke="#312e81" stroke-width="1.2" stroke-dasharray="4 8"/>
  <circle r="78" fill="none" stroke="#164e63" stroke-width="1"/>
  <g><circle cx="0" cy="-116" r="8" fill="#67e8f9" filter="url(#glow)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/></g>
  <g><circle cx="78" cy="0" r="5" fill="#c084fc"/><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/></g>
  <g><circle cx="0" cy="-50" r="4" fill="#f59e0b"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></g>
  <circle r="34" fill="#060816" stroke="#67e8f9" stroke-opacity=".35"/>
  <text x="0" y="6" text-anchor="middle" fill="#f8fafc" font-size="26" font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="700">TN</text>
</g>
<text x="380" y="150" fill="#93c5fd" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" letter-spacing="3">THIRD NATURE / CELESTIAL SYSTEM</text>
<text x="380" y="220" fill="#f8fafc" font-size="58" font-weight="800" font-family="Inter,Arial,sans-serif">FOR THINGS THAT</text>
<text x="380" y="284" fill="#f8fafc" font-size="58" font-weight="800" font-family="Inter,Arial,sans-serif">DON’T EXIST YET.</text>
<line x1="382" y1="312" x2="1080" y2="312" stroke="url(#line)" stroke-width="2"><animate attributeName="x2" values="500;1080;500" dur="9s" repeatCount="indefinite"/></line>
<text x="380" y="350" fill="#94a3b8" font-size="15" font-family="ui-monospace,Menlo,Consolas,monospace">creative developer · full-stack · SaaS · desktop</text>
<text x="380" y="384" fill="#64748b" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">building interfaces, systems and products with gravity, motion and identity</text>
<g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">
  <rect x="380" y="416" width="170" height="42" rx="21" fill="#0b1220" stroke="#164e63"/><circle cx="402" cy="437" r="4" fill="#67e8f9"><animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/></circle><text x="417" y="441" fill="#cbd5e1">SYSTEM ONLINE</text>
  <rect x="565" y="416" width="190" height="42" rx="21" fill="#0b1220" stroke="#4c1d95"/><text x="590" y="441" fill="#cbd5e1">BUILDING · SHIPPING</text>
</g>
</svg>