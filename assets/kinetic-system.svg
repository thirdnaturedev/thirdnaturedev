  <rect x="910" y="150" width="200" height="64" rx="12" fill="#0d171d" stroke="#20424a"/><text x="930" y="177" fill="#64748B">DESKTOP</text><text x="930" y="199" fill="#F8FAFC">macOS / Windows / native</text>
