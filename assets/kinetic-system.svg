<text x="48" y="86" fill="#F8FAFC" font-size="28" font-weight="700" font-family="Inter,Arial,sans-serif">Build across interfaces, products, and platforms.</text>
<text x="48" y="115" fill="#94A3B8" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace">software × design × motion × experimentation</text>

