<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04070b"/><stop offset=".55" stop-color="#071117"/><stop offset="1" stop-color="#08120f"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#5EEAD4"/><stop offset=".55" stop-color="#A3E635"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#5EEAD4" stop-opacity=".25"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#14303a" opacity=".28"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="610" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="608" rx="25" fill="none" stroke="#19333a"/>
<rect width="1200" height="610" rx="26" fill="url(#grid)"/>
<text x="46" y="54" fill="#5EEAD4" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">TECHNOLOGY REACTOR / ACTIVE MAP</text>
<text x="46" y="89" fill="#F8FAFC" font-size="30" font-weight="700" font-family="Inter,Arial,sans-serif">A layered system — not a logo wall.</text>
<text x="46" y="113" fill="#94A3B8" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace">UI → application logic → services → data → native surfaces → delivery</text>

<!-- core -->
<g transform="translate(600 325)">
  <circle r="123" fill="url(#core)"/>
  <circle r="104" fill="#071117" stroke="#23444b" stroke-width="1.5"/>
  <circle r="76" fill="none" stroke="#5EEAD4" opacity=".28" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle>
  <circle r="52" fill="none" stroke="#F59E0B" opacity=".38" stroke-dasharray="2 7"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/></circle>
  <circle r="31" fill="#0b1a1f" stroke="#A3E635"/>
  <text y="-5" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">PRODUCT</text>
  <text y="16" text-anchor="middle" fill="#A3E635" font-size="10" font-family="ui-monospace,Menlo,Consolas,monospace">SYSTEM CORE</text>
</g>

<!-- connectors -->
<g fill="none" stroke="#24434a" stroke-width="1.2">
  <path d="M492 280 C430 250 390 220 325 210"/>
  <path d="M490 350 C430 375 390 405 325 410"/>
  <path d="M708 280 C770 250 810 220 875 210"/>
  <path d="M710 350 C770 375 810 405 875 410"/>
  <path d="M600 220 C600 180 600 155 600 135"/>
  <path d="M600 430 C600 470 600 495 600 520"/>
</g>
<g fill="#5EEAD4" filter="url(#glow)">
  <circle r="3"><animateMotion dur="3.2s" repeatCount="indefinite" path="M492 280 C430 250 390 220 325 210"/></circle>
  <circle r="3"><animateMotion dur="3.8s" repeatCount="indefinite" path="M490 350 C430 375 390 405 325 410"/></circle>
  <circle r="3"><animateMotion dur="3.4s" repeatCount="indefinite" path="M708 280 C770 250 810 220 875 210"/></circle>
  <circle r="3"><animateMotion dur="4.1s" repeatCount="indefinite" path="M710 350 C770 375 810 405 875 410"/></circle>
</g>

<!-- cards -->
<g font-family="ui-monospace,Menlo,Consolas,monospace">
  <g><rect x="54" y="162" width="285" height="120" rx="15" fill="#081218" stroke="#1c3941"/><text x="74" y="190" fill="#5EEAD4" font-size="11">01 / INTERFACE LAYER</text><text x="74" y="218" fill="#F8FAFC" font-size="16" font-weight="700">Next.js · React · Tailwind</text><text x="74" y="244" fill="#94A3B8" font-size="11">Motion systems · responsive UI</text><text x="74" y="262" fill="#94A3B8" font-size="11">immersive scene composition</text></g>
  <g><rect x="54" y="352" width="285" height="120" rx="15" fill="#081218" stroke="#1c3941"/><text x="74" y="380" fill="#F59E0B" font-size="11">02 / APPLICATION LAYER</text><text x="74" y="408" fill="#F8FAFC" font-size="16" font-weight="700">TypeScript · JavaScript</text><text x="74" y="434" fill="#94A3B8" font-size="11">State · workflows · orchestration</text><text x="74" y="452" fill="#94A3B8" font-size="11">API-driven product behavior</text></g>
  <g><rect x="861" y="162" width="285" height="120" rx="15" fill="#081218" stroke="#1c3941"/><text x="881" y="190" fill="#A3E635" font-size="11">03 / SERVICE LAYER</text><text x="881" y="218" fill="#F8FAFC" font-size="16" font-weight="700">Node.js · APIs · .NET</text><text x="881" y="244" fill="#94A3B8" font-size="11">Backend services · auth flows</text><text x="881" y="262" fill="#94A3B8" font-size="11">product integrations</text></g>
  <g><rect x="861" y="352" width="285" height="120" rx="15" fill="#081218" stroke="#1c3941"/><text x="881" y="380" fill="#5EEAD4" font-size="11">04 / DATA LAYER</text><text x="881" y="408" fill="#F8FAFC" font-size="16" font-weight="700">Supabase · PostgreSQL</text><text x="881" y="434" fill="#94A3B8" font-size="11">MongoDB · multi-tenant data</text><text x="881" y="452" fill="#94A3B8" font-size="11">structured product state</text></g>
  <g><rect x="432" y="126" width="336" height="74" rx="14" fill="#081218" stroke="#1c3941"/><text x="452" y="153" fill="#F59E0B" font-size="11">05 / NATIVE SURFACES</text><text x="452" y="179" fill="#F8FAFC" font-size="15" font-weight="700">Swift · SwiftUI · C# · desktop</text></g>
  <g><rect x="432" y="480" width="336" height="76" rx="14" fill="#081218" stroke="#1c3941"/><text x="452" y="507" fill="#A3E635" font-size="11">06 / DELIVERY & CRAFT</text><text x="452" y="533" fill="#F8FAFC" font-size="15" font-weight="700">GitHub Actions · Git · Figma · VS Code</text></g>
</g>

<line x1="46" y1="580" x2="1154" y2="580" stroke="url(#edge)" stroke-width="2" opacity=".7"><animate attributeName="x2" values="250;1154;250" dur="9s" repeatCount="indefinite"/></line>
</svg>