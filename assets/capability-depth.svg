<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#05080d"/><stop offset="1" stop-color="#08120f"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="470" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="468" rx="25" fill="none" stroke="#1b3a41"/>
<text x="46" y="52" fill="#5EEAD4" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">CAPABILITY DEPTH / WHERE THE WORK GETS INTERESTING</text>
<text x="46" y="88" fill="#F8FAFC" font-size="30" font-weight="700" font-family="Inter,Arial,sans-serif">Not just implementation. Product behavior, systems and feel.</text>

<g font-family="ui-monospace,Menlo,Consolas,monospace">
  <g transform="translate(55 135)"><rect width="340" height="260" rx="18" fill="#09131a" stroke="#1d3b43"/><text x="22" y="33" fill="#5EEAD4" font-size="11">IMMERSIVE INTERFACES</text><text x="22" y="69" fill="#F8FAFC" font-size="20" font-weight="700">Experience systems</text><text x="22" y="104" fill="#94A3B8" font-size="11">Scene composition</text><text x="22" y="126" fill="#94A3B8" font-size="11">Motion choreography</text><text x="22" y="148" fill="#94A3B8" font-size="11">Depth / hierarchy / pacing</text><text x="22" y="170" fill="#94A3B8" font-size="11">Responsive behavior</text><text x="22" y="192" fill="#94A3B8" font-size="11">Touch-first mobile adaptation</text><line x1="22" y1="216" x2="318" y2="216" stroke="#19363d"/><text x="22" y="241" fill="#5EEAD4" font-size="10">GOAL → make interaction feel intentional</text></g>
  <g transform="translate(430 135)"><rect width="340" height="260" rx="18" fill="#09131a" stroke="#1d3b43"/><text x="22" y="33" fill="#A3E635" font-size="11">PRODUCT ARCHITECTURE</text><text x="22" y="69" fill="#F8FAFC" font-size="20" font-weight="700">System thinking</text><text x="22" y="104" fill="#94A3B8" font-size="11">Multi-tenant structure</text><text x="22" y="126" fill="#94A3B8" font-size="11">Role-based experiences</text><text x="22" y="148" fill="#94A3B8" font-size="11">Workflow modeling</text><text x="22" y="170" fill="#94A3B8" font-size="11">API / data boundaries</text><text x="22" y="192" fill="#94A3B8" font-size="11">Desktop + web product surfaces</text><line x1="22" y1="216" x2="318" y2="216" stroke="#19363d"/><text x="22" y="241" fill="#A3E635" font-size="10">GOAL → reduce ambiguity before coding</text></g>
  <g transform="translate(805 135)"><rect width="340" height="260" rx="18" fill="#09131a" stroke="#1d3b43"/><text x="22" y="33" fill="#F59E0B" font-size="11">ENGINEERING CRAFT</text><text x="22" y="69" fill="#F8FAFC" font-size="20" font-weight="700">Build for change</text><text x="22" y="104" fill="#94A3B8" font-size="11">Typed application code</text><text x="22" y="126" fill="#94A3B8" font-size="11">Reusable UI systems</text><text x="22" y="148" fill="#94A3B8" font-size="11">Service boundaries</text><text x="22" y="170" fill="#94A3B8" font-size="11">GitHub Actions / delivery</text><text x="22" y="192" fill="#94A3B8" font-size="11">Polish without fragile complexity</text><line x1="22" y1="216" x2="318" y2="216" stroke="#19363d"/><text x="22" y="241" fill="#F59E0B" font-size="10">GOAL → keep the product evolvable</text></g>
</g>

<circle cx="395" cy="265" r="4" fill="#5EEAD4" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
<circle cx="770" cy="265" r="4" fill="#A3E635" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
</svg>