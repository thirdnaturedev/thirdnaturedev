<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#5EEAD4"/><stop offset=".55" stop-color="#A3E635"/><stop offset="1" stop-color="#F59E0B"/></linearGradient></defs>
<rect width="1200" height="500" rx="28" fill="#060907"/><rect x="1" y="1" width="1198" height="498" rx="27" fill="none" stroke="#223229"/>
<text x="52" y="62" fill="#708078" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">WORKING SET / NOT A STACK — A SYSTEM OF SURFACES</text>
<text x="52" y="115" fill="#F6F7F3" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">Tools change. The system stays.</text>
<text x="52" y="147" fill="#95a29b" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">I move across product layers instead of living inside one framework.</text>
<g font-family="ui-monospace,Menlo,Consolas,monospace">
<g transform="translate(70 245)"><circle r="56" fill="#0d1511" stroke="#294036"/><text text-anchor="middle" y="-7" fill="#5EEAD4" font-size="14">INTERFACE</text><text text-anchor="middle" y="16" fill="#dce5df" font-size="11">Next · React · Tailwind</text><circle r="4" cx="0" cy="-56" fill="#5EEAD4"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></circle></g>
<g transform="translate(300 245)"><circle r="56" fill="#0d1511" stroke="#294036"/><text text-anchor="middle" y="-7" fill="#A3E635" font-size="14">SYSTEMS</text><text text-anchor="middle" y="16" fill="#dce5df" font-size="11">Node · APIs · .NET</text><circle r="4" cx="56" cy="0" fill="#A3E635"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/></circle></g>
<g transform="translate(530 245)"><circle r="56" fill="#0d1511" stroke="#294036"/><text text-anchor="middle" y="-7" fill="#F59E0B" font-size="14">DATA</text><text text-anchor="middle" y="16" fill="#dce5df" font-size="11">Supabase · Postgres</text><circle r="4" cx="0" cy="56" fill="#F59E0B"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></circle></g>
<g transform="translate(760 245)"><circle r="56" fill="#0d1511" stroke="#294036"/><text text-anchor="middle" y="-7" fill="#5EEAD4" font-size="14">NATIVE</text><text text-anchor="middle" y="16" fill="#dce5df" font-size="11">Swift · C# · Desktop</text><circle r="4" cx="-56" cy="0" fill="#5EEAD4"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/></circle></g>
<g transform="translate(990 245)"><circle r="56" fill="#0d1511" stroke="#294036"/><text text-anchor="middle" y="-7" fill="#A3E635" font-size="14">CRAFT</text><text text-anchor="middle" y="16" fill="#dce5df" font-size="11">Figma · Motion · Git</text><circle r="4" cx="0" cy="-56" fill="#A3E635"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/></circle></g>
<path d="M126 245 H244 M356 245 H474 M586 245 H704 M816 245 H934" stroke="url(#g)" stroke-width="2" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;-34" dur="2.4s" repeatCount="indefinite"/></path>
</g>
<text x="70" y="392" fill="#65756d" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">01 / shape the interaction</text><text x="300" y="392" fill="#65756d" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">02 / connect the logic</text><text x="530" y="392" fill="#65756d" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">03 / structure the state</text><text x="760" y="392" fill="#65756d" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">04 / extend to devices</text><text x="990" y="392" fill="#65756d" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">05 / refine the feel</text>
<line x1="70" y1="442" x2="1130" y2="442" stroke="#1b2b23"/><line x1="70" y1="442" x2="1130" y2="442" stroke="url(#g)" stroke-width="2"><animate attributeName="x2" values="70;1130;70" dur="9s" repeatCount="indefinite"/></line>
</svg>