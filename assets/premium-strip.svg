<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="86" viewBox="0 0 1180 86" role="img" aria-label="Third Nature animated status strip">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1178" height="84" rx="22" fill="#0B1220" stroke="#1E293B"/>
  <rect x="2" y="2" width="1176" height="82" rx="21" fill="none" stroke="url(#g)" stroke-opacity=".35">
    <animate attributeName="stroke-opacity" values=".22;.65;.22" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="24" y="22" width="198" height="42" rx="21" fill="#111827" stroke="#24434A"/>
  <circle cx="49" cy="43" r="6" fill="#A3E635" filter="url(#glow)"><animate attributeName="r" values="5;8;5" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="67" y="48" fill="#E2E8F0" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">BUILDING</text>

  <rect x="238" y="22" width="230" height="42" rx="21" fill="#111827" stroke="#24434A"/>
  <text x="262" y="48" fill="#5EEAD4" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">CREATIVE SYSTEMS</text>

  <rect x="484" y="22" width="214" height="42" rx="21" fill="#111827" stroke="#24434A"/>
  <text x="507" y="48" fill="#F8FAFC" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">FULL-STACK</text>

  <rect x="714" y="22" width="180" height="42" rx="21" fill="#111827" stroke="#24434A"/>
  <text x="742" y="48" fill="#F59E0B" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">SaaS DEV</text>

  <rect x="910" y="22" width="246" height="42" rx="21" fill="#111827" stroke="#24434A"/>
  <text x="934" y="48" fill="#CBD5E1" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">SHIPPING EXPERIMENTS</text>
  <circle cx="1124" cy="43" r="5" fill="#F59E0B"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle>

  <rect x="24" y="76" width="1132" height="2" rx="1" fill="url(#g)" opacity=".3">
    <animate attributeName="x" values="-300;24;300" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>